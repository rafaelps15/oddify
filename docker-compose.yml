name: oddify

services:
  oddify.database:
    image: postgres:16-alpine
    container_name: Oddify.Database
    environment:
      - POSTGRES_DB=oddify
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - ./.containers/db:/var/lib/postgresql/data
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d oddify"]
      interval: 2s
      timeout: 5s
      retries: 15

  oddify.seq:
    image: datalust/seq:latest
    container_name: Oddify.Seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - 5341:5341
      - 8082:80

  oddify.redis:
    image: redis:latest
    container_name: Oddify.Redis
    restart: always
    ports:
      - 6379:6379

  oddify.api:
    image: ${DOCKER_REGISTRY-}oddifyapi
    container_name: Oddify.Api
    build:
      context: .
      dockerfile: src/API/Oddify.Api/Dockerfile
    depends_on:
      oddify.database:
        condition: service_healthy
      oddify.redis:
        condition: service_started
      oddify.seq:
        condition: service_started
